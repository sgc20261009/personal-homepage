<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f2f5;
    color: #333;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 48px 40px;
    text-align: center;
    max-width: 520px;
    width: 90%;
  }
  .card h1 {
    font-size: 28px;
    margin-bottom: 12px;
    color: #222;
  }
  .card p {
    font-size: 14px;
    color: #888;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    padding: 14px 40px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: #1a73e8;
    border-radius: 8px;
    text-decoration: none;
    transition: background 0.2s, transform 0.1s;
  }
  .btn:hover {
    background: #1557b0;
    transform: translateY(-1px);
  }
  .btn:active {
    transform: translateY(0);
  }
  .btn-row {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-row .btn {
    flex: 1 1 200px;
    max-width: 220px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>个人主页</h1>
    <p>工具入口</p>
    <div class="btn-row">
      <a class="btn" href="https://sgc20261009.github.io/parallel-key-keyway-chart/" target="_blank" rel="noopener">键槽尺寸速查</a>
      <a class="btn" href="https://sgc20261009.github.io/magnet-weight-calculator/" target="_blank" rel="noopener">磁钢重量计算</a>
      <a class="btn" href="https://sgc20261009.github.io/pipe-weight-calculator/" target="_blank" rel="noopener">管材重量计算器</a>
    </div>
  </div>
</body>
</html>
